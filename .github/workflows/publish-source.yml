name: Publish bundled Next.js source
on:
  push:
    paths:
      - "tg-installations-maroc-source.zip"
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[expand-source]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project into repository root
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync
          mkdir -p /tmp/tg-source
          unzip -oq tg-installations-maroc-source.zip -d /tmp/tg-source
          rsync -a --exclude='.git' /tmp/tg-source/tg-installations-maroc/ ./
          rm -f tg-installations-maroc-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Next.js app source [expand-source]"
          git push
