name: Publish bundled Next.js source
on:
  push:
    paths:
      - "source-archive/READY"
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[expand-source]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore application source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync
          cat source-archive/part-* > /tmp/tg-source.b64
          base64 --decode /tmp/tg-source.b64 > /tmp/tg-source.zip
          mkdir -p /tmp/tg-source
          unzip -oq /tmp/tg-source.zip -d /tmp/tg-source
          rsync -a --exclude='.git' /tmp/tg-source/tg-installations-maroc/ ./
          rm -rf source-archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Next.js app source [expand-source]"
          git push
